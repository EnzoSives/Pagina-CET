# orqen configuration for the 9-step flow: project, connectors (where the tickets live) and workflow. Edit as needed.
# Tokens never go here: they live in ~/.orqen/credentials.env. How the project starts is in orqen/environment.yaml.
version: 1
orqen:
  cli: 0.1.37
  kit: 0.1.37
project:
  name: pagina-cet
  base_branch: dev
agent:
  command: claude -p --permission-mode acceptEdits
openspec:
  install: devDependency
  version: 2.2.0
  tools:
    - claude
    - codex
connectors:
  requests:
    type: jira
    project: REQ
    filter: project = REQ AND statusCategory != Done
  issues:
    type: jira
    project: SIS
    issue_type: Task
    link_type: Relates
workflow:
  support: false
  code_review:
    gate: github
  devel_branch: desarrollo
